name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntax check (every Python file must compile)
        run: python -m compileall -q .
      - name: Lint — real errors only (undefined names, syntax, bad comparisons)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks — block any committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
